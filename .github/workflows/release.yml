name: Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Source workflow run id containing prebuilt release artifacts
        required: true
        type: string
      release_version:
        description: Release version from the source prepare step (e.g. 1.17.0)
        required: true
        type: string

# Serialize every release-path run (normal pushes and manual recovery) at the
# repository level so a normal push cannot race a pinned-version recovery.
concurrency:
  group: release-${{ github.repository_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  prepare:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: checks
    permissions:
      contents: read
    outputs:
      has_release: ${{ steps.prepare.outputs.has_release }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Predict Release Version
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-tools.mjs prepare

  cli:
    name: Build Common CLI Archive
    needs: prepare
    if: github.event_name == 'push' && needs.prepare.outputs.has_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Update Version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
      - run: npm run build:cli-release
      - uses: actions/upload-artifact@v6
        with:
          name: common-cli-setup
          path: release/*-cli-setup.zip
          retention-days: 14
          if-no-files-found: error

  build:
    needs: [prepare, cli]
    if: github.event_name == 'push' && needs.prepare.outputs.has_release == 'true'
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Setup Native Binaries
        shell: bash
        run: node scripts/setup-binaries.mjs ${{ runner.os == 'macOS' && '--universal' || '' }}

      - name: Update Version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Build
        run: npm run dist -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Common CLI Setup Archive
        uses: actions/download-artifact@v8
        with:
          name: common-cli-setup
          path: release

      - name: Verify Installed CLI and Desktop
        if: runner.os != 'Linux'
        run: node scripts/package-smoke.mjs

      - name: Verify Installed CLI and Desktop (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/package-smoke.mjs

      - name: Retain Native UI Proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: package-proof-${{ matrix.os }}
          path: release/package-smoke-*.png
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-${{ matrix.os }}
          path: |
            release/*-setup.exe
            release/*-universal.dmg
            release/*-universal.zip
            release/*.AppImage
            ${{ runner.os == 'Linux' && 'release/*-cli-setup.zip' || '' }}
            release/latest*.yml
            release/*.blockmap
          retention-days: 14
          if-no-files-found: error

  release:
    needs: [prepare, build]
    if: github.event_name == 'push' && needs.prepare.outputs.has_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm 12.2.0 (OIDC-capable)
        run: npm install --global npm@12.2.0

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v8
        with:
          name: artifacts-windows-latest
          path: release

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v8
        with:
          name: artifacts-macos-latest
          path: release

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v8
        with:
          name: artifacts-ubuntu-latest
          path: release

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: npx release-it "$RELEASE_VERSION" --ci

  recover:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read # cross-run artifact downloads
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Checkout control checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm 12.2.0 (OIDC-capable)
        run: npm install --global npm@12.2.0

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Validate source run and tag
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: node scripts/release-tools.mjs source "$SOURCE_RUN_ID" "$RELEASE_VERSION"

      - name: Checkout pinned source at tag
        uses: actions/checkout@v5
        with:
          path: recovery-source
          ref: ${{ steps.source.outputs.tag }}
          fetch-depth: 0

      - name: Install Source Dependencies
        working-directory: recovery-source
        run: npm ci --ignore-scripts

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v8
        with:
          name: artifacts-windows-latest
          path: release
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v8
        with:
          name: artifacts-macos-latest
          path: release
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v8
        with:
          name: artifacts-ubuntu-latest
          path: release
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Recover release publications
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          TAG: ${{ steps.source.outputs.tag }}
        run: >-
          node scripts/release-tools.mjs recover
          "$SOURCE_RUN_ID" "$RELEASE_VERSION" release recovery-source
